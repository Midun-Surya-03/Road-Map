<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Cyber-Frame -->
  <rect x="20" y="20" width="472" height="472" rx="10" fill="#020617" stroke="#1E1B4B" stroke-width="4"/>
  <path d="M20 100 H80 M432 100 H492 M20 412 H80 M432 412 H492" stroke="#4C1D95" stroke-width="8"/>
  <path d="M100 20 V80 M100 432 V492 M412 20 V80 M412 432 V492" stroke="#4C1D95" stroke-width="8"/>

  <!-- Complex Grid -->
  <path d="M20 160 H492 M20 256 H492 M20 352 H492 M160 20 V492 M256 20 V492 M352 20 V492" stroke="#1E1B4B" stroke-width="1" stroke-opacity="0.5"/>

  <!-- The Main Core Housing -->
  <rect x="80" y="80" width="352" height="352" rx="4" fill="#0F172A" stroke="#8B5CF6" stroke-width="2"/>
  
  <!-- Heat Fin Greebles -->
  <rect x="100" y="90" width="312" height="10" rx="2" fill="#1E293B"/>
  <rect x="100" y="110" width="312" height="10" rx="2" fill="#1E293B"/>
  <rect x="100" y="392" width="312" height="10" rx="2" fill="#1E293B"/>
  <rect x="100" y="412" width="312" height="10" rx="2" fill="#1E293B"/>

  <!-- Logic Bus Traces (Glowing) -->
  <path d="M80 180 H140 L160 160 H200" stroke="#D946EF" stroke-width="2" stroke-opacity="0.6"/>
  <path d="M432 332 H372 L352 352 H312" stroke="#D946EF" stroke-width="2" stroke-opacity="0.6"/>
  <path d="M180 80 V140 L160 160 V200" stroke="#D946EF" stroke-width="2" stroke-opacity="0.6"/>
  <path d="M332 432 V372 L352 352 V312" stroke="#D946EF" stroke-width="2" stroke-opacity="0.6"/>

  <!-- The Reactor Window -->
  <rect x="140" y="140" width="232" height="232" rx="4" fill="#1E1B4B" stroke="#A855F7" stroke-width="8"/>
  
  <!-- The "36" Brand - Optical Nudge Alignment -->
  <!-- Shifted Y to 248 (up from 256) and adjusted horizontal spacing -->
  <text 
    x="256" 
    y="248" 
    dy=".35em"
    text-anchor="middle" 
    fill="#F5F3FF" 
    style="font-family: 'JetBrains Mono', 'Courier New', monospace; font-weight: 900; font-size: 150px; letter-spacing: -2px; filter: drop-shadow(0 0 15px #8B5CF6);"
  >36</text>

  <!-- Status Lights -->
  <circle cx="160" cy="160" r="6" fill="#10B981"><animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite" /></circle>
  <circle cx="352" cy="352" r="6" fill="#EF4444"><animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite" /></circle>

  <!-- ID Tags -->
  <text x="145" y="155" fill="#8B5CF6" style="font-family: monospace; font-size: 8px;">LN_X72_P</text>
  <text x="325" y="365" fill="#8B5CF6" style="font-family: monospace; font-size: 8px;">SEC_0036</text>
</svg>
